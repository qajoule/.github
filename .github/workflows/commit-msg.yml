# Checks the commit messages of a pull request against CONTRIBUTING.md
# (Conventional Commits 1.0.0). Other repositories call it:
#
#   on: pull_request
#   jobs:
#     commit-msg:
#       uses: qajoule/.github/.github/workflows/commit-msg.yml@main
#
# The checker is inline so that the workflow and its script always come from
# the same commit. It checks only what applies to every contributor: the
# first line, the blank line after it, and the footer form. The maintainer's
# Japanese summaries are checked before the commit by a local git hook.
name: Commit messages

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - "$BASE" "$HEAD" <<'PY'
          # BEGIN check-commit-msg
          import re
          import subprocess
          import sys

          TYPES = ("feat", "fix", "docs", "chore", "refactor", "test",
                   "perf", "build", "ci", "style", "revert")
          SUBJECT = re.compile(r"^([a-z]+)(\([a-z0-9-]+\))?(!)?: (\S.*)$")
          # Only "Token: value", as in CONTRIBUTING.md and the local hook
          # (Conventional Commits also allows "Token #value"; it is not used here).
          TRAILER = re.compile(r"^(BREAKING CHANGE|[A-Za-z0-9-]+): \S")
          # A last paragraph with a line like this is a footer, so "Closes #3" is reported.
          TRAILER_LIKE = re.compile(r"^(BREAKING CHANGE|[A-Za-z0-9-]+)(: | #)\S")


          def problems(message):
              lines = message.rstrip("\n").split("\n")
              subject = lines[0]
              if subject.startswith(("Merge ", 'Revert "', "fixup! ", "squash! ")):
                  return []
              found = []
              m = SUBJECT.match(subject)
              if not m:
                  found.append("first line is not '<type>[(<scope>)][!]: <description>': " + subject)
              elif m.group(1) not in TYPES:
                  found.append("type must be one of " + ", ".join(TYPES) + ": " + m.group(1))
              if len(lines) > 1 and lines[1].strip():
                  found.append("the first line must be followed by a blank line")
              paragraphs = re.split(r"\n\s*\n", "\n".join(lines[1:]).strip())
              if len(paragraphs) > 0 and paragraphs[-1] and len(lines) > 2:
                  last = paragraphs[-1].split("\n")
                  if any(TRAILER_LIKE.match(line) for line in last):
                      for line in last:
                          if not TRAILER.match(line):
                              found.append("footer line is not 'Token: value': " + line)
              return found


          def main(base, head):
              log = subprocess.run(
                  ["git", "log", "--format=%h%x00%B%x01", base + ".." + head],
                  capture_output=True, text=True, check=True).stdout
              commits = [c.lstrip("\n") for c in log.split("\x01") if c.strip()]
              bad = 0
              for entry in commits:
                  sha, message = entry.split("\x00", 1)
                  for p in problems(message):
                      print(f"{sha}: {p}")
                      bad += 1
              if bad:
                  print("The commit message rules are in CONTRIBUTING.md of qajoule/.github.")
                  return 1
              print(f"{len(commits)} commit messages checked, no problems.")
              return 0


          sys.exit(main(sys.argv[1], sys.argv[2]))
          # END check-commit-msg
          PY
