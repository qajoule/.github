name: Bug report
description: Report something that does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. The maintainer tracks work outside GitHub and moves accepted reports there, so this issue may be closed with a note once it is recorded.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, tag or commit you used.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime and other versions that may matter.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste error messages or output. Remove secrets first.
      render: text
